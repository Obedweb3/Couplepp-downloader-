<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CouplePP Downloader</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    h1 {
      color: #00aaff;
    }

    form {
      background-color: #1e1e1e;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px #00aaff55;
      max-width: 400px;
      width: 100%;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #00aaff;
    }

    input {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: none;
      border-radius: 5px;
      background-color: #2c2c2c;
      color: #ffffff;
    }

    button {
      background-color: #00aaff;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background-color: #008ecc;
    }

    .result {
      margin-top: 2rem;
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .result img {
      max-width: 200px;
      border-radius: 10px;
      box-shadow: 0 0 10px #00aaff55;
    }
  </style>
</head>
<body>
  <h1>CouplePP Downloader</h1>
  <form id="coupleForm">
    <label for="apikey">API Key</label>
    <input type="text" id="apikey" placeholder="Enter your API key" required />

    <label for="user1">Username 1</label>
    <input type="text" id="user1" placeholder="e.g., user1" required />

    <label for="user2">Username 2</label>
    <input type="text" id="user2" placeholder="e.g., user2" required />

    <button type="submit">Get Couple PP</button>
  </form>

  <div class="result" id="result"></div>

  <script>
    document.getElementById('coupleForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const apikey = document.getElementById('apikey').value;
      const user1 = document.getElementById('user1').value;
      const user2 = document.getElementById('user2').value;

      const url = `https://apis.davidcyriltech.my.id/couplepp?apikey=${apikey}&user1=${user1}&user2=${user2}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = `
          <div>
            <h3>${user1}</h3>
            <img src="${data.result.user1}" alt="User 1 PP" />
          </div>
          <div>
            <h3>${user2}</h3>
            <img src="${data.result.user2}" alt="User 2 PP" />
          </div>
        `;
      } catch (error) {
        alert('Failed to fetch couple profile pictures. Please check your API key and usernames.');
        console.error(error);
      }
    });
  </script>
</body>
  </html>
